# Builds the Paperclip server image (Dockerfile target `production`) and
# publishes it to GHCR. Dokploy only pulls; it never builds.
#   push staging -> :staging, :staging-<sha>  -> redeploy staging
#   push main    -> :main,    :main-<sha>     -> redeploy production
# Redeploy webhooks come from the Dokploy app (Deployments -> Webhook URL),
# stored as repo secrets DOKPLOY_WEBHOOK_STAGING / DOKPLOY_WEBHOOK_PRODUCTION.
name: Image

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          build-args: PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Redeploy on Dokploy
        env:
          HOOK: ${{ github.ref_name == 'main' && secrets.DOKPLOY_WEBHOOK_PRODUCTION || secrets.DOKPLOY_WEBHOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then echo "No Dokploy webhook secret for ${{ github.ref_name }}; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
