name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      paperclip_version:
        description: "Upstream Paperclip image tag (ghcr.io/paperclipai/paperclip:<tag>). Empty = Dockerfile default"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/paperclip

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          v="${{ inputs.paperclip_version }}"
          if [ -z "$v" ]; then v="$(sed -n 's/^ARG PAPERCLIP_VERSION=//p' Dockerfile)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The base image is ~2.5 GB compressed; free runner disk before pulling it.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags:
      #   <version>-<sha>  immutable, pin this in Dokploy
      #   <version>        latest fixes on that upstream version
      #   latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: PAPERCLIP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-${{ steps.v.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
